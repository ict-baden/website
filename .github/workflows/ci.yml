name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  packages: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ASTRO_TELEMETRY_DISABLED: "1"
      SITE_STAGING: "1"
      SITE_URL: https://ictbaden.netgetvpn.de
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Abhängigkeiten
        run: npm ci

      - name: Produktdaten prüfen (keine internen Inhalte)
        run: npm run check:products

      - name: Rechner gegen Originalformeln prüfen
        run: npm test

      - name: Build
        run: npm run build

      - name: Linkprüfung
        run: npm run check:links

      - name: HTML-Prüfung (html-validate inkl. Barrierefreiheitsregeln)
        run: npm run check:html

      - name: SEO-Prüfung (Titel, Beschreibungen, hreflang, JSON-LD, Sitemap, robots.txt, llms.txt)
        run: npm run check:seo

      # Livegang-Fassung: dieselbe Seite mit SITE_STAGING=0 und kanonischen Adressen auf ict-baden.de. Wird bei jedem
      # Lauf gebaut und geprüft und auf main als ghcr.io/ict-baden/website:live veröffentlicht (siehe README, "Going live").
      - name: Livegang-Fassung bauen und prüfen (robots.txt, kanonische Adressen auf ict-baden.de, kein noindex)
        env:
          SITE_STAGING: "0"
          SITE_URL: https://ict-baden.de
          INDEXNOW_KEY: ${{ vars.INDEXNOW_KEY }}
          GOOGLE_SITE_VERIFICATION: ${{ vars.GOOGLE_SITE_VERIFICATION }}
          BING_SITE_VERIFICATION: ${{ vars.BING_SITE_VERIFICATION }}
        run: |
          npx astro build --outDir dist-live
          node scripts/check-seo.mjs dist-live
          node scripts/check-links.mjs dist-live
          node scripts/check-live.mjs dist-live

      - name: Barrierefreiheit (axe-core, hell/dunkel, 1440/390 px)
        # Nutzt das auf dem Runner installierte Google Chrome
        run: npm run check:a11y

      # Autodeploy: nur auf main. Die geprüfte Seite wird als nginx-Image veröffentlicht; Watchtower auf docker01
      # holt es innerhalb von 5 Minuten und startet ictbaden-web neu. Welcher Commit läuft: /version.txt
      # Zwei Images aus derselben Prüfung:
      #   :latest / :<commit>          Vorschau ictbaden.netgetvpn.de (noindex) – Watchtower auf docker01 holt es
      #   :live   / :live-<commit>     Livegang ict-baden.de (indexierbar) – läuft erst, wenn jemand es startet
      #                                (deploy/docker-compose.live.yml, README "Going live"); Watchtower folgt dann :live
      - name: Images bauen und prüfen
        env:
          IMAGE: ghcr.io/ict-baden/website
        run: |
          REV="$(git rev-parse --short HEAD)"
          docker build -f deploy/Dockerfile --build-arg REV="$REV" --build-arg SITE_STAGING=1 --build-arg DIST=dist \
            -t "$IMAGE:latest" -t "$IMAGE:$REV" .
          docker build -f deploy/Dockerfile --build-arg REV="$REV" --build-arg SITE_STAGING=0 --build-arg DIST=dist-live \
            -t "$IMAGE:live" -t "$IMAGE:live-$REV" .
          scripts/probe-image.sh "$IMAGE:$REV" staging "$REV"
          scripts/probe-image.sh "$IMAGE:live-$REV" live "$REV"

      - name: Images veröffentlichen (ghcr.io)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          IMAGE: ghcr.io/ict-baden/website
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          REV="$(git rev-parse --short HEAD)"
          for t in "$REV" latest "live-$REV" live; do docker push "$IMAGE:$t"; done

      - name: Build-Artefakt (nur bei Fehlern)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: |
            dist
            dist-live
          retention-days: 1
