name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  packages: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ASTRO_TELEMETRY_DISABLED: "1"
      SITE_STAGING: "1"
      SITE_URL: https://ictbaden.netgetvpn.de
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Abhängigkeiten
        run: npm ci

      - name: Produktdaten prüfen (keine internen Inhalte)
        run: npm run check:products

      - name: Rechner gegen Originalformeln prüfen
        run: npm test

      - name: Build
        run: npm run build

      - name: Linkprüfung
        run: npm run check:links

      - name: HTML-Prüfung (html-validate inkl. Barrierefreiheitsregeln)
        run: npm run check:html

      - name: SEO-Prüfung (Titel, Beschreibungen, hreflang, JSON-LD, Sitemap, robots.txt, llms.txt)
        run: npm run check:seo

      - name: Livegang-Modus bauen und prüfen (robots.txt, kanonische Adressen auf ict-baden.de)
        env:
          SITE_STAGING: "0"
          SITE_URL: https://ict-baden.de
        run: |
          npx astro build --outDir dist-live
          node scripts/check-seo.mjs dist-live
          node scripts/check-links.mjs dist-live

      - name: Barrierefreiheit (axe-core, hell/dunkel, 1440/390 px)
        # Nutzt das auf dem Runner installierte Google Chrome
        run: npm run check:a11y

      # Autodeploy: nur auf main. Die geprüfte Seite wird als nginx-Image veröffentlicht; Watchtower auf docker01
      # holt es innerhalb von 5 Minuten und startet ictbaden-web neu. Welcher Commit läuft: /version.txt
      - name: Image bauen und veröffentlichen (ghcr.io)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          IMAGE: ghcr.io/ict-baden/website
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          REV="$(git rev-parse --short HEAD)"
          docker build -f deploy/Dockerfile --build-arg REV="$REV" --build-arg SITE_STAGING="$SITE_STAGING" \
            -t "$IMAGE:latest" -t "$IMAGE:$REV" .
          docker run --rm -d --name probe -p 8080:80 "$IMAGE:$REV"
          for i in $(seq 1 20); do curl -fsS http://127.0.0.1:8080/health >/dev/null && break; sleep 1; done
          test "$(curl -fsS http://127.0.0.1:8080/version.txt)" = "$REV"
          curl -fsS -o /dev/null http://127.0.0.1:8080/
          # Konfiguration wirkt: Weiterleitungen und noindex-Kopfzeile der Vorschau
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/produkte/industrialkeyboard)" = 301
          test "$(curl -s -o /dev/null -w '%{http_code}' 'http://127.0.0.1:8080/index.html?page=contact')" = 301
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/produkte/vitrine/)" = 200
          if [ "$SITE_STAGING" = "1" ]; then curl -sI http://127.0.0.1:8080/ | grep -qi '^x-robots-tag: *noindex'; fi
          docker rm -f probe
          docker push "$IMAGE:$REV"
          docker push "$IMAGE:latest"

      - name: Build-Artefakt (nur bei Fehlern)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 1
