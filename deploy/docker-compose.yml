# ICT Baden – Website auf docker01 (Vorschau ictbaden.netgetvpn.de über den Cloudflare-Tunnel)
# Liegt in /srv/docker/ictbaden.netgetvpn.de. Autodeploy: die CI veröffentlicht bei jedem Push auf main
# ghcr.io/ict-baden/website:latest, Watchtower holt neue Versionen innerhalb von 5 Minuten.
# Zurück auf einen älteren Stand: IMAGE_TAG=<commit> deploy/deploy.sh (Watchtower bleibt dann auf diesem Tag).
services:
  web:
    image: ghcr.io/ict-baden/website:${IMAGE_TAG:-latest}
    container_name: ictbaden-web
    restart: unless-stopped
    ports:
      - "192.168.4.6:8017:80"
    security_opt:
      - no-new-privileges:true
    labels:
      com.centurylinklabs.watchtower.enable: "true"
      cf.tunnel.hostname: "ictbaden.netgetvpn.de"
      cf.tunnel.service: "http://192.168.4.6:8017"
      cf.tunnel.access: "none"
