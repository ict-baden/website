# ICT Baden – Website auf docker01 (Vorschau ictbaden.netgetvpn.de über den Cloudflare-Tunnel)
# Liegt nach dem Deploy in $DEPLOY_DIR neben public_html/ und conf/ (siehe deploy/deploy.sh).
services:
  web:
    image: nginx:1.27-alpine
    container_name: ictbaden-web
    restart: unless-stopped
    ports:
      - "192.168.4.6:8017:80"
    volumes:
      # public_html/current ist ein Symlink auf das aktuelle Release (atomarer Wechsel beim Deploy)
      - ./public_html:/usr/share/nginx/html:ro
      # Das Verzeichnis einbinden, nicht die Datei: deploy.sh ersetzt default.conf per mv (neuer Inode). Eine
      # einzeln eingebundene Datei zeigt danach weiter auf den alten Inhalt – neue Weiterleitungen und der Wegfall
      # von "X-Robots-Tag: noindex" beim Livegang kämen nie an.
      - ./conf:/etc/nginx/conf.d:ro
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    labels:
      cf.tunnel.hostname: "ictbaden.netgetvpn.de"
      cf.tunnel.service: "http://192.168.4.6:8017"
      cf.tunnel.access: "none"
