# ICT Baden – statische Website (nginx 1.27, als conf.d/default.conf im Container, siehe deploy/Dockerfile)
#
# Zwei Markierungen am Zeilenende (deploy/Dockerfile filtert sie beim Bauen des Images):
#   STAGING – nur in der Vorschau (ictbaden.netgetvpn.de, SITE_STAGING=1), entfällt im Live-Image
#   LIVE    – nur im Live-Image (ict-baden.de, SITE_STAGING=0), entfällt in der Vorschau

# Cache-Steuerung nach Pfad: Dateien mit Hash im Namen dauerhaft, Produktbilder und OG-Bilder einen Tag (Dateinamen
# ohne Hash – nach einem Sync sollen neue Bilder schnell ankommen), übrige Bilder eine Woche, Seiten immer prüfen
map $uri $ictb_cache {
    default                                   "no-cache";
    ~^/_astro/                                "public, max-age=31536000, immutable";
    ~^/(media|og)/                            "public, max-age=86400";
    ~^/brand/                                 "public, max-age=604800";
    ~\.(?:woff2|avif|webp|png|jpg|svg|ico|pdf)$    "public, max-age=604800";
    ~\.(?:css|js|webmanifest)$                "public, max-age=3600, must-revalidate";
}

# Alte Adressen der bisherigen Website: index.html?page=<name>
map $arg_page $ictb_page {
    default          "";
    start            /;
    portfolio        "/#leistungen";
    downloads        "/#bewaehrt";
    modbus           "/#modbus";
    contact          "/#kontakt";
    about            "/#ueber-uns";
    imprint          /impressum/;
    privacy          /datenschutz/;
    counter-pulse    /werkzeuge/pulswertigkeit/;
}

# Live: Jede andere Adresse als ict-baden.de – www, die Alias-Domains (ict-baden.com, ictbaden.de, it-baden.de,
# itbaden.de, itbaden.org), eine IP – leitet dauerhaft auf https://ict-baden.de um (Zeile mit LIVE im server-Block).
# /health bleibt unter jeder Adresse erreichbar (Gesundheitsprüfung von Docker und deploy/deploy.sh über 127.0.0.1).
map "$host$uri" $ictb_other_host {
    default             1;
    ~^ict-baden\.de/    0;
    ~^[^/]*/health$     0;
}

# Protokoll ohne weitergereichte Client-Adressen (X-Forwarded-For, CF-Connecting-IP), siehe Datenschutzerklärung
log_format ictb '$remote_addr - [$time_local] "$request" $status $body_bytes_sent "$http_referer" "$http_user_agent"';

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html/current;
    index index.html;
    charset utf-8;

    # Live: andere Hosts → https://ict-baden.de (siehe map $ictb_other_host oben); http → https erledigt Cloudflare
    # („Always Use HTTPS“, README „Going live“), nginx sieht hinter dem Tunnel nur http
    if ($ictb_other_host) { return 301 https://ict-baden.de$request_uri; }   # LIVE
    # www.ict-baden.de → ict-baden.de (in der Vorschau ohne die Regel darüber); kanonisch ist die Adresse ohne www
    if ($host = www.ict-baden.de) {
        return 301 https://ict-baden.de$request_uri;
    }

    server_tokens off;
    absolute_redirect off;
    access_log /var/log/nginx/access.log ictb;

    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 512;
    gzip_types text/css text/plain text/javascript application/javascript application/json
               application/manifest+json application/xml image/svg+xml;

    # Sicherheits-Header (gelten für alle Antworten; in den location-Blöcken deshalb kein add_header)
    add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; font-src 'self'; media-src 'self'; connect-src 'self'; manifest-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'; object-src 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    add_header X-Frame-Options "DENY" always;
    # HSTS ohne includeSubDomains: welche Subdomains es gibt (mail.ict-baden.de u. a.) und ob sie HTTPS können, ist offen
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header Cache-Control $ictb_cache always;
    add_header X-Robots-Tag "noindex, nofollow" always;   # STAGING

    # Untertitel des Videos (nicht in den Standard-MIME-Typen von nginx)
    location ~ \.vtt$ {
        default_type text/vtt;
        types { }
    }

    location = /health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Startseite, auch für alte Links wie /index.html?page=contact
    location = / {
        if ($ictb_page) {
            return 301 $ictb_page;
        }
        try_files /index.html =404;
    }
    # /index.html ohne page= ist ein Duplikat der Startseite
    location = /index.html {
        if ($ictb_page) {
            return 301 $ictb_page;
        }
        return 301 /;
    }

    # Einzelseiten der bisherigen Website
    location = /start.html         { return 301 /; }
    location = /portfolio.html     { return 301 "/#leistungen"; }
    location = /downloads.html     { return 301 "/#bewaehrt"; }
    location = /contact.html       { return 301 "/#kontakt"; }
    location = /about.html         { return 301 "/#ueber-uns"; }
    location = /imprint.html       { return 301 /impressum/; }
    location = /privacy.html       { return 301 /datenschutz/; }
    location = /counter-pulse.html { return 301 /werkzeuge/pulswertigkeit/; }
    location = /images/Anfahrtsbeschreibung.png { return 301 /media/kontakt/anfahrt-karte.webp; }
    location = /Start.html         { return 301 /; }
    location = /Index.html         { return 301 /; }
    location = /modbus.html        { return 301 "/#modbus"; }
    location = /images/ICT-BADEN.png { return 301 /brand/ict-baden-logo.svg; }
    # Seiten der Website vor 2022 (Wayback Machine)
    location = /about/Anfahrt.html              { return 301 "/#anfahrt"; }
    location = /about/Anfahrtsbeschreibung.pdf  { return 301 /Anfahrtsbeschreibung.pdf; }
    location = /about/Kontakt.html              { return 301 "/#kontakt"; }
    location = /about/Impressum.html            { return 301 /impressum/; }
    location = /about/Datenschutz.html          { return 301 /datenschutz/; }
    location = /about/Consulting.html           { return 301 "/#leistungen"; }
    location ~ ^/(Tron/index\.html|[dD]ownloads/Tron\.exe)$ { return 301 "/#bewaehrt"; }

    # Umbenannte Produktseiten (Name aus der README des Produkt-Repos) – dauerhaft weitergeleitet, deutsch und englisch
    location ~ ^/produkte/industrialkeyboard/?$ { return 301 /produkte/industrial-keyboard/; }
    location ~ ^/en/products/industrialkeyboard/?$ { return 301 /en/products/industrial-keyboard/; }
    location = /og/produkte/industrialkeyboard.jpg { return 301 /og/produkte/industrial-keyboard.jpg; }
    location ~ ^/produkte/haertungs-check/?$ { return 301 /produkte/riegel/; }
    location ~ ^/en/products/haertungs-check/?$ { return 301 /en/products/riegel/; }
    location = /og/produkte/haertungs-check.jpg { return 301 /og/produkte/riegel.jpg; }
    location ~ ^/produkte/labeldesigner/?$ { return 301 /produkte/plakette/; }
    location ~ ^/en/products/labeldesigner/?$ { return 301 /en/products/plakette/; }
    # EnterpriseBrowser heißt seit 2026-10-21 Pforte (Produktseite, englische Seite, Datenschutz der App, OG-Bilder)
    location ~ ^/produkte/enterprisebrowser/?$ { return 301 /produkte/pforte/; }
    location ~ ^/en/products/enterprisebrowser/?$ { return 301 /en/products/pforte/; }
    location ~ ^/datenschutz/enterprisebrowser/?$ { return 301 /datenschutz/pforte/; }
    location = /og/produkte/enterprisebrowser.jpg { return 301 /og/produkte/pforte.jpg; }
    location = /og/en/produkte/enterprisebrowser.jpg { return 301 /og/en/produkte/pforte.jpg; }
    # Die App verlinkt /datenschutz/industrialkeyboard/; die Schreibweise der Produktseite führt dorthin
    location ~ ^/datenschutz/industrial-keyboard/?$ { return 301 /datenschutz/industrialkeyboard/; }
    # One-Pager (2026-10-20): die früheren Unterseiten zeigen auf ihre Abschnitte der Startseite
    # (/produkte/ und /en/products/ sind seit 2026-10-21 wieder eigene Seiten: die Produktübersicht deutsch und englisch)
    location ~ ^/leistungen/?$ { return 301 "/#leistungen"; }
    location ~ ^/downloads/?$  { return 301 "/#bewaehrt"; }
    location ~ ^/ueber-uns/?$  { return 301 "/#ueber-uns"; }
    location ~ ^/kontakt/?$    { return 301 "/#kontakt"; }

    # Ideen und interne Projekte, die nie als Produkt veröffentlicht werden (Stand vor der Auswahl in
    # scripts/public-overrides.json, „veroeffentlicht“): 410 Gone – Suchmaschinen entfernen sie schneller als bei einer
    # Weiterleitung auf die Startseite (die Google ohnehin als Soft-404 werten würde). Name- und id-Schreibweisen.
    location ~ ^/(?:produkte|en/products)/(?:bacnet-explorer|dateischleuse|ethernet-ip-explorer|ethernetip-explorer|explorer-framework|fernwartung|frist|fuehler|gpo-doku|gpo-doku-und-vergleich|hausmeister|iec-61850-browser|iec61850-browser|it-ot-dateischleuse|label-print-server|lotse|merker|modbus-explorer|moderne-visualisierung|netzprofil-umschalter|opc-ua-explorer|opcua-explorer|pcs-7-alternative|pcs7-alternative|plc-projekt-versionierung|plc-versionierung|ppwr-verpackungsdaten|profinet-scanner|prozessleitsystem|redfish-explorer|redfish-ipmi-explorer|revier|rundgang|rz-energiebericht|s7-explorer|scep-est|securedesktop|snmp-explorer|tftp-sftp-server|update-server|update-server-fuer-ot|usb-pruefstation|user-review|verpackungsmengen-plugin|vial-scanner|visualisierung|wincc-alternative|wincc-audit-trail-viewer|zebra-druckerflotte-monitor|zertifikats-ablauf-scanner|zertifikatsserver)/?$ {
        return 410;
    }

    # /.well-known/ (security.txt, Bestätigungsdateien) ist erlaubt, andere versteckte Pfade nicht
    location ^~ /.well-known/ {
        try_files $uri =404;
    }
    location ~ /\. {
        deny all;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    # 404 und 410 zeigen dieselbe Seite (mit Navigation zu Produkten und Kontakt)
    error_page 404 410 /404.html;
}
