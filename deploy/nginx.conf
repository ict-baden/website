# ICT Baden – statische Website (nginx 1.27, als conf.d/default.conf im Container)
#
# deploy/deploy.sh lädt diese Datei als conf/default.conf hoch. Zeilen mit der Markierung "# STAGING"
# entfallen beim Livegang (SITE_STAGING=0). Ausgeliefert wird public_html/current, ein Symlink auf das
# aktuelle Release – so wechselt ein Deploy ohne Neustart und ohne halb kopierte Seiten.

# Cache-Steuerung nach Pfad: Dateien mit Hash im Namen dauerhaft, Produktbilder und OG-Bilder einen Tag (Dateinamen
# ohne Hash – nach einem Sync sollen neue Bilder schnell ankommen), übrige Bilder eine Woche, Seiten immer prüfen
map $uri $ictb_cache {
    default                                   "no-cache";
    ~^/_astro/                                "public, max-age=31536000, immutable";
    ~^/(media|og)/                            "public, max-age=86400";
    ~^/brand/                                 "public, max-age=604800";
    ~\.(?:woff2|webp|png|jpg|svg|ico|pdf)$    "public, max-age=604800";
    ~\.(?:css|js|webmanifest)$                "public, max-age=3600, must-revalidate";
}

# Alte Adressen der bisherigen Website: index.html?page=<name>
map $arg_page $ictb_page {
    default          "";
    start            /;
    portfolio        "/#leistungen";
    downloads        "/#bewaehrt";
    modbus           "/#modbus";
    contact          "/#kontakt";
    about            "/#ueber-uns";
    imprint          /impressum/;
    privacy          /datenschutz/;
    counter-pulse    /werkzeuge/pulswertigkeit/;
}

# Protokoll ohne weitergereichte Client-Adressen (X-Forwarded-For, CF-Connecting-IP), siehe Datenschutzerklärung
log_format ictb '$remote_addr - [$time_local] "$request" $status $body_bytes_sent "$http_referer" "$http_user_agent"';

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html/current;
    index index.html;
    charset utf-8;

    server_tokens off;
    absolute_redirect off;
    access_log /var/log/nginx/access.log ictb;

    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 512;
    gzip_types text/css text/plain text/javascript application/javascript application/json
               application/manifest+json application/xml image/svg+xml;

    # Sicherheits-Header (gelten für alle Antworten; in den location-Blöcken deshalb kein add_header)
    add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; font-src 'self'; connect-src 'self'; manifest-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'; object-src 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    add_header X-Frame-Options "DENY" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header Cache-Control $ictb_cache always;
    add_header X-Robots-Tag "noindex, nofollow" always;   # STAGING

    location = /health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Startseite, auch für alte Links wie /index.html?page=contact
    location = / {
        if ($ictb_page) {
            return 301 $ictb_page;
        }
        try_files /index.html =404;
    }
    # /index.html ohne page= ist ein Duplikat der Startseite
    location = /index.html {
        if ($ictb_page) {
            return 301 $ictb_page;
        }
        return 301 /;
    }

    # Einzelseiten der bisherigen Website
    location = /start.html         { return 301 /; }
    location = /portfolio.html     { return 301 "/#leistungen"; }
    location = /downloads.html     { return 301 "/#bewaehrt"; }
    location = /contact.html       { return 301 "/#kontakt"; }
    location = /about.html         { return 301 "/#ueber-uns"; }
    location = /imprint.html       { return 301 /impressum/; }
    location = /privacy.html       { return 301 /datenschutz/; }
    location = /counter-pulse.html { return 301 /werkzeuge/pulswertigkeit/; }
    location = /images/Anfahrtsbeschreibung.png { return 301 /media/kontakt/anfahrt-karte.webp; }
    location = /Start.html         { return 301 /; }
    location = /Index.html         { return 301 /; }
    location = /modbus.html        { return 301 "/#modbus"; }
    location = /images/ICT-BADEN.png { return 301 /brand/ict-baden-logo.svg; }
    # Seiten der Website vor 2022 (Wayback Machine)
    location = /about/Anfahrt.html              { return 301 "/#anfahrt"; }
    location = /about/Anfahrtsbeschreibung.pdf  { return 301 /Anfahrtsbeschreibung.pdf; }
    location = /about/Kontakt.html              { return 301 "/#kontakt"; }
    location = /about/Impressum.html            { return 301 /impressum/; }
    location = /about/Datenschutz.html          { return 301 /datenschutz/; }
    location = /about/Consulting.html           { return 301 "/#leistungen"; }
    location ~ ^/(Tron/index\.html|[dD]ownloads/Tron\.exe)$ { return 301 "/#bewaehrt"; }

    # Umbenannte Produktseiten (Name aus der README des Produkt-Repos)
    location ~ ^/produkte/industrialkeyboard/?$ { return 301 /produkte/industrial-keyboard/; }
    location = /og/produkte/industrialkeyboard.jpg { return 301 /og/produkte/industrial-keyboard.jpg; }
    location ~ ^/produkte/haertungs-check/?$ { return 301 /produkte/riegel/; }
    location = /og/produkte/haertungs-check.jpg { return 301 /og/produkte/riegel.jpg; }
    location ~ ^/produkte/labeldesigner/?$ { return 301 "/#produkte"; }
    # One-Pager (2026-10-20): die früheren Unterseiten zeigen auf ihre Abschnitte der Startseite
    location ~ ^/leistungen/?$ { return 301 "/#leistungen"; }
    location ~ ^/produkte/?$   { return 301 "/#produkte"; }
    location ~ ^/downloads/?$  { return 301 "/#bewaehrt"; }
    location ~ ^/ueber-uns/?$  { return 301 "/#ueber-uns"; }
    location ~ ^/kontakt/?$    { return 301 "/#kontakt"; }
    # Englische Produktseiten liegen unter /en/products/<slug>/, die Übersicht ist /en/
    location ~ ^/en/products/?$ { return 301 /en/; }
    location ~ ^/en/products/plakette/?$ { return 301 /en/; }

    # Produkte, die nicht (mehr) veröffentlicht sind (nur Ideen oder noch nicht freigegeben): zur Übersicht.
    # Die Liste stammt aus dem Stand vor der Auswahl in scripts/public-overrides.json ("veroeffentlicht").
    location ~ ^/produkte/(plakette|vial-scanner|usb-pruefstation|securedesktop|user-review|wincc-audit-trail-viewer|gpo-doku-und-vergleich|modbus-explorer|hausmeister|fuehler|frist|rundgang|merker|lotse|opc-ua-explorer|profinet-scanner|iec-61850-browser|explorer-framework|tftp-sftp-server|netzprofil-umschalter|fernwartung|label-print-server|zertifikatsserver|it-ot-dateischleuse|update-server-fuer-ot|rz-energiebericht|zebra-druckerflotte-monitor|plc-projekt-versionierung|prozessleitsystem|moderne-visualisierung|ppwr-verpackungsdaten|verpackungsmengen-plugin)/?$ {
        return 301 "/#produkte";
    }

    location ~ /\. {
        deny all;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    error_page 404 /404.html;
}
